<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Knowledge-base chatbot demo with grounded answers, citations, refusals, and evaluation handoff.">
    <title>Knowledge Base Chatbot Demo</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #182230;
        --muted: #667085;
        --line: #d7dee8;
        --panel: #ffffff;
        --band: #f4f7fb;
        --soft: #eef6f3;
        --teal: #087066;
        --teal-dark: #07564f;
        --blue: #225caa;
        --violet: #5b4ab5;
        --amber: #9a6200;
        --red: #b2362f;
        --green: #13734d;
        --shadow: 0 18px 42px rgba(31, 45, 61, 0.11);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(244, 247, 251, 0.97), rgba(250, 252, 253, 0.98)),
          linear-gradient(90deg, rgba(8, 112, 102, 0.05), rgba(34, 92, 170, 0.04));
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .shell {
        width: min(1260px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0;
      }

      .workspace {
        display: grid;
        gap: 16px;
      }

      .topbar,
      .main-grid,
      .output-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 20px 22px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(1.45rem, 2.7vw, 2.25rem);
        line-height: 1.06;
        letter-spacing: 0;
      }

      h2 {
        font-size: 1rem;
        line-height: 1.25;
      }

      h3 {
        font-size: 0.93rem;
        line-height: 1.25;
      }

      .eyebrow {
        margin-bottom: 5px;
        color: var(--teal-dark);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .status-strip,
      .toolbar,
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .status-pill,
      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 27px;
        border-radius: 999px;
        padding: 0 10px;
        color: #344054;
        background: #e8eef6;
        font-size: 0.76rem;
        font-weight: 760;
      }

      .status-pill.good,
      .chip.good {
        color: var(--green);
        background: rgba(19, 115, 77, 0.12);
      }

      .chip.warn {
        color: var(--amber);
        background: rgba(154, 98, 0, 0.12);
      }

      .chip.stop {
        color: var(--red);
        background: rgba(178, 54, 47, 0.12);
      }

      button {
        min-height: 40px;
        border: 0;
        border-radius: 6px;
        padding: 0 13px;
        color: white;
        background: var(--teal);
        font-weight: 780;
        cursor: pointer;
      }

      button:hover {
        background: var(--teal-dark);
      }

      button.secondary {
        border: 1px solid #c6d0dd;
        color: var(--blue);
        background: #fff;
      }

      button.secondary:hover {
        color: #143b70;
        background: #f4f7fb;
      }

      .main-grid {
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr) 330px;
        min-height: 690px;
        overflow: hidden;
      }

      .source-panel,
      .chat-panel,
      .eval-panel {
        display: grid;
        align-content: start;
        gap: 14px;
        padding: 16px;
      }

      .source-panel {
        border-right: 1px solid var(--line);
        background: var(--band);
      }

      .eval-panel {
        border-left: 1px solid var(--line);
        background: #fbfcfe;
      }

      label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 40px;
        border: 1px solid #c6d0dd;
        border-radius: 6px;
        padding: 0 11px;
        color: var(--ink);
        background: white;
        text-transform: none;
      }

      textarea {
        min-height: 128px;
        padding: 11px;
        resize: vertical;
        line-height: 1.45;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--teal);
        outline: 3px solid rgba(8, 112, 102, 0.17);
      }

      .doc-list,
      .question-list,
      .hit-list,
      .eval-list {
        display: grid;
        gap: 8px;
      }

      .doc-button,
      .question-button,
      .hit,
      .eval-item {
        border: 1px solid #dce3ed;
        border-radius: 8px;
        background: white;
      }

      .doc-button,
      .question-button {
        display: grid;
        gap: 7px;
        width: 100%;
        min-height: 72px;
        padding: 11px;
        color: var(--ink);
        text-align: left;
        box-shadow: none;
      }

      .doc-button.active,
      .question-button.active,
      .doc-button:hover,
      .question-button:hover {
        border-color: rgba(8, 112, 102, 0.52);
        background: rgba(8, 112, 102, 0.07);
      }

      .doc-button strong,
      .question-button strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.9rem;
      }

      .doc-button span,
      .question-button span {
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.35;
      }

      .chat-panel {
        grid-template-rows: auto auto minmax(0, 1fr) auto;
      }

      .ask-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 118px;
        gap: 8px;
      }

      .answer-card {
        display: grid;
        gap: 13px;
        min-height: 360px;
        border: 1px solid #dce3ed;
        border-radius: 8px;
        padding: 15px;
        background: #fff;
      }

      .answer-body {
        color: #283545;
        font-size: 0.98rem;
        line-height: 1.58;
      }

      .citation-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .citation {
        display: grid;
        gap: 7px;
        min-height: 116px;
        border: 1px solid #dce3ed;
        border-radius: 8px;
        padding: 10px;
        background: #fbfcfe;
      }

      .citation code {
        color: var(--violet);
        font-weight: 800;
      }

      .citation p,
      .hit p,
      .eval-item p {
        color: #36465a;
        font-size: 0.84rem;
        line-height: 1.45;
      }

      .control-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .hit,
      .eval-item {
        display: grid;
        gap: 7px;
        padding: 10px;
      }

      .score {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 9px;
        align-items: center;
      }

      .meter {
        height: 9px;
        overflow: hidden;
        border-radius: 999px;
        background: #e3e9f2;
      }

      .meter span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--teal), var(--blue));
      }

      .output-panel {
        padding: 16px;
      }

      pre {
        min-height: 220px;
        margin: 12px 0 0;
        overflow: auto;
        border: 1px solid #dce3ed;
        border-radius: 8px;
        padding: 13px;
        color: #182230;
        background: #f7f9fc;
        font-size: 0.82rem;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      @media (max-width: 1060px) {
        .main-grid {
          grid-template-columns: 1fr;
        }

        .source-panel,
        .eval-panel {
          border: 0;
        }

        .source-panel {
          border-bottom: 1px solid var(--line);
        }

        .eval-panel {
          border-top: 1px solid var(--line);
        }

        .citation-grid,
        .control-row {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100vw - 20px, 1260px);
          padding: 10px 0;
        }

        .topbar,
        .ask-row {
          grid-template-columns: 1fr;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-labelledby="app-title">
        <header class="topbar">
          <div>
            <p class="eyebrow">Grounded chatbot delivery slice</p>
            <h1 id="app-title">Knowledge Base Chatbot</h1>
          </div>
          <div class="status-strip" aria-label="Build status">
            <span class="status-pill good">Cited answers</span>
            <span class="status-pill">Strict retrieval</span>
            <span class="status-pill">Synthetic docs</span>
          </div>
        </header>

        <section class="main-grid" aria-label="Knowledge-base chatbot workspace">
          <aside class="source-panel">
            <div>
              <p class="eyebrow">Corpus</p>
              <h2>Sample knowledge sets</h2>
            </div>

            <div id="doc-list" class="doc-list" aria-live="polite"></div>

            <label>
              Add safe snippet
              <textarea id="new-snippet" aria-label="New safe snippet">Refund escalations must include order id, plan name, payment date, and customer-requested outcome before finance review.</textarea>
            </label>
            <button id="add-snippet" type="button">Add Snippet</button>
          </aside>

          <section class="chat-panel">
            <div>
              <p class="eyebrow">Question</p>
              <div class="ask-row">
                <input id="question" type="search" value="What should support collect before escalating a refund?" aria-label="Question">
                <button id="ask" type="button">Ask</button>
              </div>
            </div>

            <div class="question-list" id="question-list" aria-label="Test questions"></div>

            <section class="answer-card" aria-label="Grounded answer">
              <div class="chips" id="answer-tags"></div>
              <p class="answer-body" id="answer-body"></p>
              <div class="citation-grid" id="citation-grid"></div>
            </section>

            <div class="control-row">
              <label>
                Answer mode
                <select id="answer-mode">
                  <option value="strict" selected>Strict citations</option>
                  <option value="brief">Brief support answer</option>
                  <option value="handoff">Escalation handoff</option>
                </select>
              </label>
              <label>
                Minimum score
                <select id="score-floor">
                  <option value="0.55">55%</option>
                  <option value="0.68" selected>68%</option>
                  <option value="0.8">80%</option>
                </select>
              </label>
              <label>
                Missing-info rule
                <select id="missing-rule">
                  <option>Refuse and ask for docs</option>
                  <option selected>Answer only supported parts</option>
                  <option>Escalate to reviewer</option>
                </select>
              </label>
            </div>
          </section>

          <aside class="eval-panel">
            <div>
              <p class="eyebrow">Retrieval trace</p>
              <h2>Evidence and checks</h2>
            </div>
            <div id="hit-list" class="hit-list"></div>

            <div>
              <p class="eyebrow">Quality gates</p>
              <div id="eval-list" class="eval-list"></div>
            </div>
          </aside>
        </section>

        <section class="output-panel" aria-label="JSON handoff">
          <div class="toolbar">
            <button class="secondary" id="copy-json" type="button">Prepare JSON</button>
            <button id="run-eval" type="button">Run Eval</button>
          </div>
          <pre id="json-output"></pre>
        </section>
      </section>
    </main>

    <script>
      const corpora = [
        {
          title: "Support policy",
          owner: "Customer operations",
          docs: [
            {
              id: "SUP-REFUND-01",
              title: "Refund escalation",
              text: "Support must collect order id, plan name, payment date, charge amount, customer-requested outcome, and prior troubleshooting notes before escalating a refund to finance."
            },
            {
              id: "SUP-SLA-04",
              title: "Response targets",
              text: "Billing and refund cases require first response within four business hours. Enterprise cases receive a two business hour first-response target."
            },
            {
              id: "SUP-TONE-02",
              title: "Customer reply tone",
              text: "Support replies should acknowledge the issue, state what is known, avoid promising approval, and provide the next review step."
            }
          ]
        },
        {
          title: "API onboarding",
          owner: "Developer success",
          docs: [
            {
              id: "API-AUTH-02",
              title: "Key rotation",
              text: "API keys should be rotated from the dashboard. Create a replacement key, update the service secret, confirm successful traffic, then revoke the old key."
            },
            {
              id: "API-RATE-03",
              title: "Rate limits",
              text: "Default workspaces receive 120 requests per minute. Burst increases require account review and a documented production use case."
            },
            {
              id: "API-WEBHOOK-05",
              title: "Webhook retry",
              text: "Webhooks retry for 24 hours using exponential backoff. Consumers should return 2xx only after durable processing or queue handoff."
            }
          ]
        },
        {
          title: "Security notes",
          owner: "Security review",
          docs: [
            {
              id: "SEC-DOC-01",
              title: "External sharing",
              text: "SOC 2 reports, penetration-test summaries, and security questionnaires can be shared only through the approved data room after NDA verification."
            },
            {
              id: "SEC-PII-06",
              title: "PII handling",
              text: "Exports containing names, emails, phone numbers, or account identifiers must be redacted before sending to external reviewers."
            },
            {
              id: "SEC-ACCESS-04",
              title: "Access review",
              text: "Admin access should be reviewed monthly. Deprovision inactive users and record the reviewer, date, and affected systems."
            }
          ]
        }
      ];

      const questions = [
        "What should support collect before escalating a refund?",
        "How do I rotate an API key without downtime?",
        "Can we send SOC 2 reports directly to a prospect?",
        "What is the founder's favorite vacation city?"
      ];

      const state = {
        corpusIndex: 0,
        question: questions[0],
        runId: "kb-chatbot-20260604-2130",
        lastHits: []
      };

      const docList = document.querySelector("#doc-list");
      const questionList = document.querySelector("#question-list");
      const questionInput = document.querySelector("#question");
      const answerBody = document.querySelector("#answer-body");
      const answerTags = document.querySelector("#answer-tags");
      const citationGrid = document.querySelector("#citation-grid");
      const hitList = document.querySelector("#hit-list");
      const evalList = document.querySelector("#eval-list");
      const jsonOutput = document.querySelector("#json-output");

      function tokens(text) {
        return text
          .toLowerCase()
          .replace(/[^a-z0-9 ]/g, " ")
          .split(/\s+/)
          .filter((token) => token.length > 2);
      }

      function scoreDoc(question, doc) {
        const query = new Set(tokens(question));
        const text = tokens(`${doc.title} ${doc.text}`);
        const overlap = text.filter((token) => query.has(token)).length;
        const uniqueOverlap = new Set(text.filter((token) => query.has(token))).size;
        const score = Math.min(0.98, (overlap * 0.1) + (uniqueOverlap * 0.14));
        return Number(score.toFixed(2));
      }

      function retrieve(question) {
        const corpus = corpora[state.corpusIndex];
        return corpus.docs
          .map((doc) => ({ ...doc, score: scoreDoc(question, doc) }))
          .sort((a, b) => b.score - a.score);
      }

      function buildAnswer(question, hits) {
        const floor = Number(document.querySelector("#score-floor").value);
        const mode = document.querySelector("#answer-mode").value;
        const supported = hits.filter((hit) => hit.score >= floor).slice(0, 2);
        const best = hits[0];

        if (!supported.length) {
          return {
            supported: false,
            body: "I do not have enough source evidence in the selected knowledge set to answer that. I would ask for the relevant internal document or route this to a reviewer instead of guessing.",
            citations: [],
            tags: ["Refusal", "No grounded answer", `best score ${best.score}`]
          };
        }

        const citeList = supported.map((hit) => hit.id).join(", ");
        let body = "";
        if (mode === "brief") {
          body = `${supported[0].text} Source: ${citeList}.`;
        } else if (mode === "handoff") {
          body = `Reviewer handoff: the answer is supported by ${citeList}. The likely customer-facing response is: ${supported[0].text} Confirm whether this policy applies to the current account before sending a final reply.`;
        } else {
          body = `Based only on the selected knowledge set, ${supported[0].text} ${supported[1] ? `Related policy: ${supported[1].text}` : ""} I would not add steps that are not present in the cited source.`;
        }

        return {
          supported: true,
          body,
          citations: supported,
          tags: ["Grounded", `${supported.length} citation${supported.length === 1 ? "" : "s"}`, `top score ${best.score}`]
        };
      }

      function renderDocs() {
        docList.innerHTML = "";
        corpora.forEach((corpus, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `doc-button${index === state.corpusIndex ? " active" : ""}`;
          button.innerHTML = `<strong>${corpus.title}</strong><span>${corpus.owner} - ${corpus.docs.length} snippets</span>`;
          button.addEventListener("click", () => {
            state.corpusIndex = index;
            render();
          });
          docList.append(button);
        });
      }

      function renderQuestions() {
        questionList.innerHTML = "";
        questions.forEach((question) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `question-button${question === state.question ? " active" : ""}`;
          button.innerHTML = `<strong>${question}</strong><span>Run through retrieval, answer, and evaluation gates</span>`;
          button.addEventListener("click", () => {
            state.question = question;
            questionInput.value = question;
            renderAnswer();
          });
          questionList.append(button);
        });
      }

      function renderAnswer() {
        state.question = questionInput.value.trim() || questions[0];
        const hits = retrieve(state.question);
        state.lastHits = hits;
        const answer = buildAnswer(state.question, hits);

        answerTags.innerHTML = "";
        answer.tags.forEach((tag) => {
          const pill = document.createElement("span");
          pill.className = `chip ${answer.supported ? "good" : "stop"}`;
          pill.textContent = tag;
          answerTags.append(pill);
        });

        answerBody.textContent = answer.body;

        citationGrid.innerHTML = "";
        if (!answer.citations.length) {
          const empty = document.createElement("div");
          empty.className = "citation";
          empty.innerHTML = "<code>NO-CITATION</code><p>No source crossed the selected confidence floor.</p>";
          citationGrid.append(empty);
        } else {
          answer.citations.forEach((hit) => {
            const item = document.createElement("article");
            item.className = "citation";
            item.innerHTML = `<code>${hit.id}</code><h3>${hit.title}</h3><p>${hit.text}</p>`;
            citationGrid.append(item);
          });
        }

        renderHits(hits);
        renderEval(answer, hits);
        renderJson(answer, hits);
      }

      function renderHits(hits) {
        hitList.innerHTML = "";
        hits.slice(0, 4).forEach((hit) => {
          const item = document.createElement("article");
          item.className = "hit";
          item.innerHTML = `
            <div class="score">
              <span class="chip ${hit.score >= 0.68 ? "good" : hit.score >= 0.45 ? "warn" : "stop"}">${Math.round(hit.score * 100)}%</span>
              <div class="meter"><span style="width: ${Math.round(hit.score * 100)}%"></span></div>
            </div>
            <h3>${hit.id} - ${hit.title}</h3>
            <p>${hit.text}</p>
          `;
          hitList.append(item);
        });
      }

      function renderEval(answer, hits) {
        const floor = Number(document.querySelector("#score-floor").value);
        const gates = [
          {
            name: "Citations required",
            ok: answer.citations.length > 0,
            note: answer.citations.length > 0 ? "Every supported answer includes source ids." : "Answer refused because no source met the floor."
          },
          {
            name: "Out-of-scope behavior",
            ok: !answer.supported || hits[0].score >= floor,
            note: "Unsupported questions are refused instead of answered from general knowledge."
          },
          {
            name: "Human review path",
            ok: true,
            note: "JSON handoff includes missing-info rule, retrieval scores, and next engineering step."
          }
        ];

        evalList.innerHTML = "";
        gates.forEach((gate) => {
          const item = document.createElement("article");
          item.className = "eval-item";
          item.innerHTML = `<span class="chip ${gate.ok ? "good" : "warn"}">${gate.ok ? "Pass" : "Review"}</span><h3>${gate.name}</h3><p>${gate.note}</p>`;
          evalList.append(item);
        });
      }

      function renderJson(answer, hits) {
        const corpus = corpora[state.corpusIndex];
        const packet = {
          run_id: state.runId,
          selected_corpus: corpus.title,
          question: state.question,
          answer_mode: document.querySelector("#answer-mode").value,
          minimum_score: Number(document.querySelector("#score-floor").value),
          missing_info_rule: document.querySelector("#missing-rule").value,
          answer: answer.body,
          supported: answer.supported,
          citations: answer.citations.map((hit) => ({
            id: hit.id,
            title: hit.title,
            score: hit.score,
            excerpt: hit.text
          })),
          top_retrieval_scores: hits.slice(0, 4).map((hit) => ({
            id: hit.id,
            score: hit.score
          })),
          next_engineering_step: "Wire this schema to document ingestion, vector retrieval, chat history policy, role-based access, and a reviewer queue before using private documents."
        };
        jsonOutput.textContent = JSON.stringify(packet, null, 2);
      }

      function render() {
        renderDocs();
        renderQuestions();
        renderAnswer();
      }

      document.querySelector("#ask").addEventListener("click", renderAnswer);
      document.querySelector("#run-eval").addEventListener("click", () => {
        state.runId = `kb-chatbot-${new Date().toISOString().slice(0, 19).replace(/[-:T]/g, "")}`;
        renderAnswer();
      });
      document.querySelector("#copy-json").addEventListener("click", renderAnswer);
      document.querySelector("#answer-mode").addEventListener("change", renderAnswer);
      document.querySelector("#score-floor").addEventListener("change", renderAnswer);
      document.querySelector("#missing-rule").addEventListener("change", renderAnswer);
      questionInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          renderAnswer();
        }
      });
      document.querySelector("#add-snippet").addEventListener("click", () => {
        const value = document.querySelector("#new-snippet").value.trim();
        if (!value) return;
        corpora[state.corpusIndex].docs.push({
          id: `SAFE-${String(corpora[state.corpusIndex].docs.length + 1).padStart(2, "0")}`,
          title: "User supplied safe snippet",
          text: value
        });
        render();
      });

      render();
    </script>
  </body>
</html>
